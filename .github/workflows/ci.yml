name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: bootstrap
        run: |
          chmod +x mvnw test scripts/*.sh
          make bootstrap
      - name: lint
        run: ./mvnw -B checkstyle:check
      - name: dependency-lock-drift
        run: |
          ./mvnw -B dependency:tree -DoutputFile=dependency-tree.txt
          ./mvnw -B dependency:list -DoutputFile=dependencies.lock -DincludeScope=runtime
          git diff --exit-code -- dependency-tree.txt dependencies.lock

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: bootstrap
        run: |
          chmod +x mvnw test scripts/*.sh
          make bootstrap
      - name: test
        run: ./mvnw -B test
      - name: coverage
        run: ./mvnw -B verify -DskipTests
      - name: upload-jacoco-xml
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            target/site/jacoco/jacoco.xml
            target/site/jacoco/index.html

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: owasp-dependency-check
        run: |
          chmod +x mvnw
          make bootstrap
          ./mvnw -B org.owasp:dependency-check-maven:check
