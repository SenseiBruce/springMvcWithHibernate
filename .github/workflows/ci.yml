name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: lint
        run: |
          chmod +x mvnw scripts/*.sh
          make bootstrap
          make lint

  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: test
        run: |
          chmod +x mvnw scripts/*.sh
          ./scripts/test.sh
      - name: verify
        run: |
          make verify

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven
      - name: owasp-dependency-check
        run: |
          chmod +x mvnw
          make bootstrap
          ./mvnw -B org.owasp:dependency-check-maven:check
